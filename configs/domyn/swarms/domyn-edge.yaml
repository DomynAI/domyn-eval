# Serves Domyn Edge. The container images and mounts are the site's, from domyn-swarm's defaults.yaml.
name: domyn-edge
model: domyn/Domyn-Edge-SFT
replicas: 4
gpus_per_replica: 1
backend:
  type: slurm
  time_limit: "12:00:00"
  endpoint:
    nginx_timeout: "8h"
    wall_time: "12:00:00"
args: >-
  --max-model-len 131072
  --dtype bfloat16
  --trust-remote-code
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.9
  --reasoning-parser qwen3
  --enable-auto-tool-choice
  --tool-call-parser qwen3_coder
env:
  HF_HOME: ${HF_HOME}
  HF_HUB_OFFLINE: "1"
