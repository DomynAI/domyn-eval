# Serves Qwen3.5-4B. The container images and mounts are the site's, from domyn-swarm's defaults.yaml.
name: qwen3.5-4b
model: Qwen/Qwen3.5-4B
replicas: 4
gpus_per_replica: 1
backend:
  type: slurm
  time_limit: "24:00:00"
  endpoint:
    nginx_timeout: "8h"
    wall_time: "24:00:00"
args: >-
  --max-model-len 262144
  --dtype bfloat16
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.9
  --language-model-only
  --reasoning-parser qwen3
  --enable-auto-tool-choice
  --tool-call-parser qwen3_coder
env:
  HF_HOME: ${HF_HOME}
  HF_HUB_OFFLINE: "1"
