# Qwen3.5-4B. With `--swarm`, domyn-swarm serves it from swarms/qwen3.5-4b.yaml; otherwise set `url`
# to an endpoint serving `path` with the parsers listed there.

[general]
num_threads = 128
request_timeout = 7200

[model]
id = "qwen3.5-4b"
path = "Qwen/Qwen3.5-4B"
swarm_config = "configs/qwen/swarms/qwen3.5-4b.yaml"

[model.generation]
reasoning = true

[model.generation.think]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
chat_template_kwargs = { enable_thinking = true }

[model.generation.nothink]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
chat_template_kwargs = { enable_thinking = false }

[judge]
swarm_config = "configs/qwen/swarms/qwen3.5-9b.yaml"


[bfcl]
fc_model = true
model_class = "Qwen/Qwen3.5-4B-FC"
