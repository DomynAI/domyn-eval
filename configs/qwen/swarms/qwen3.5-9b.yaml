# Serves Qwen3.5-9B as the judge. The container images and mounts are the site's, from domyn-swarm's defaults.yaml.
name: qwen3.5-9b
model: Qwen/Qwen3.5-9B
replicas: 4
gpus_per_replica: 1
backend:
  type: slurm
  time_limit: "24:00:00"
  endpoint:
    nginx_timeout: "8h"
    wall_time: "24:00:00"
args: >-
  --max-model-len 32768
  --max-num-seqs 1024
  --dtype bfloat16
  --gpu-memory-utilization 0.95
  --max-num-batched-tokens 32768
  --language-model-only
  --reasoning-parser qwen3
env:
  HF_HOME: ${HF_HOME}
  HF_HUB_OFFLINE: "1"
