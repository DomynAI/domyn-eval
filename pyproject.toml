[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domyn-eval"
version = "0.1.0"
description = "Evaluate LLMs on benchmark suites, against any OpenAI-compatible endpoint, locally or on SLURM."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Domyn" }]
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.1.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "rich>=14.3.4",
    "tomli-w>=1.2.0",
    "domyn-swarm>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/DomynAI/domyn-eval"
Repository = "https://github.com/DomynAI/domyn-eval"
Documentation = "https://github.com/DomynAI/domyn-eval/tree/main/docs"
Issues = "https://github.com/DomynAI/domyn-eval/issues"

[project.optional-dependencies]
# pinned to the version locked in the suite's checkout; tests/test_suite_versions.py keeps them equal
inspect-ai = ["inspect-ai==0.3.285"]
lm-eval = [
    "lm-eval[api,ruler]>=0.4.13",
    "transformers>=5.22.1",
]

[project.scripts]
domyn-eval = "domyn_eval.cli:cli"

[tool.setuptools.package-data]
"domyn_eval.slurm" = ["*.j2"]

[dependency-groups]
test = [
    "domyn-eval[inspect-ai,lm-eval]",
    "pytest>=9.1.1",
]

[tool.uv.sources]
domyn-swarm = { git = "https://github.com/DomynAI/domyn-swarm", tag = "v0.35.0"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real suites against a fake endpoint; needs network or a warm HF cache"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
force-exclude = true
extend-exclude = [
    ".ipynb_checkpoints",
    "docs",
    "suites",
    "reproduction",
]

[tool.ruff.lint]
# CPY001 is a preview rule; explicit-preview-rules enables only the preview rules listed by name
preview = true
explicit-preview-rules = true
extend-select = ["CPY001"]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ANN",
    "BLE",
    "FBT",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PT",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "ARG",
    "PTH",
    "TRY",
    "NPY",
    "PERF",
    "RUF",
]
ignore = [
    # Missing docstring in public package
    "D100",
    # Missing docstring in public module
    "D104",
    # Not supported by Pydantic
    "UP046",
    # Caching default value is set in the decorator
    "FBT001",
    # Ray type hint is not compatible with paths
    "PTH207",
    # Not supported by enums
    "RUF012",
]

[tool.ruff.lint.extend-per-file-ignores]
# Ignore unused imports
"__init__.py" = ["F401"]
# Ignore pydocstyle rules for tests
# Tests can access private functions
# Tests do not need type annotations or copyright headers
"tests/*" = ["D", "SLF001", "ANN", "CPY001"]

[tool.ruff.lint.flake8-annotations]
# `__init__` needs no `-> None` once its arguments are typed
mypy-init-return = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-FileCopyrightText: \\d{4} Domyn"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".git",
    "**/build",
    "env/**",
    ".venv",
    "**/.*",
    "suites/**",
]
defineConstant = { DEBUG = true }
reportMissingImports = "error"
reportMissingTypeStubs = false

pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
